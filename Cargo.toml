[workspace]
resolver = "2"
members = ["crates/engine", "crates/cangjie-sys", "crates/cangjie", "crates/rime-sys", "crates/rime", "crates/pinyin-sys", "crates/pinyin", "crates/config", "settings"]

[workspace.dependencies]
# Newest libcosmic revision that still builds with rustc 1.91, the latest toolchain
# available on Launchpad for noble (Pop!_OS itself uses rust-all 1.95). Bump when
# Launchpad gains a newer rustc-1.xx.
cosmic-config = { git = "https://github.com/pop-os/libcosmic", rev = "dc84488cd873", default-features = false, features = ["macro"] }
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "dc84488cd873", default-features = false }
cosmic-theme = { git = "https://github.com/pop-os/libcosmic", rev = "dc84488cd873", default-features = false }

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/wanleung/cosmic-ext-ime"

[package]
name = "cosmic-ext-ime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Wayland (zwp_input_method_v2) Chinese input method for COSMIC — Cangjie/Quick via libcangjie2"

[dependencies]
cosmic-ext-ime-engine = { path = "crates/engine" }
cosmic-ext-ime-cangjie = { path = "crates/cangjie" }
cosmic-ext-ime-rime = { path = "crates/rime" }
cosmic-ext-ime-pinyin = { path = "crates/pinyin" }
cosmic-ext-ime-config = { path = "crates/config" }
cosmic-config = { workspace = true, features = ["calloop"] }
cosmic-theme = { workspace = true }
calloop = "0.14"
calloop-wayland-source = "0.4"

wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
xkbcommon = "0.9"
cosmic-text = "0.19"
memmap2 = "0.9"
rustix = { version = "1", features = ["fs"] }

anyhow = "1"
log = "0.4"
env_logger = "0.11"
