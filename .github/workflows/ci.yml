name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Clippy and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libclang-dev libcangjie2-dev libcangjie2-data libsqlite3-dev \
            librime-dev librime-data rime-data-cangjie5 libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  deb:
    name: Debian package
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debhelper devscripts just pkg-config libclang-dev libcangjie2-dev \
            libsqlite3-dev librime-dev libxkbcommon-dev libwayland-dev lintian
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build package
        # -d: Ubuntu's rust-all is older than our MSRV; the rustup toolchain is used instead.
        run: VENDOR=0 dpkg-buildpackage -us -uc -b -d
      - name: Collect package
        run: |
          mkdir -p dist
          mv ../cosmic-ext-ime_*.deb dist/
          lintian dist/*.deb || true
      - uses: actions/upload-artifact@v4
        with:
          name: cosmic-ext-ime-deb
          path: dist/*.deb
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
